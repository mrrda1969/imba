name: imba
description: "Accommodation aggregating app"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  provider: ^6.1.4
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  http: ^1.1.0
  url_launcher: ^6.1.14
  flutter_paypal: ^0.2.0
  photo_view: ^0.15.0
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.5.2
  geolocator: ^13.0.4
  flutter_launcher_icons: ^0.14.3
  font_awesome_flutter: ^10.8.0
  flutter_cors: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.8
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
